name: Build and Release IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS IPA (Simulator/Generic Release)
        run: |
          flutter build ios --release --no-codesign

      - name: Package and Create IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          elif [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            cp -r build/ios/iphonesimulator/Runner.app build/ios/ipa/Payload/
          fi
          cd build/ios/ipa
          zip -r ../../../AzawyLux.ipa Payload
          cd -

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzawyLux-IPA
          path: AzawyLux.ipa
