name: Build and Release IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Configure iOS Platform
        run: flutter create . --platforms=ios --project-name=azawy_lux

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          find . -name ".DS_Store" -delete
          find . -name "__MACOSX" -exec rm -rf {} +
          zip -r -Z store LeicaLuxCamera.ipa Payload
          mkdir -p ../../../output
          mv LeicaLuxCamera.ipa ../../../output/

      - name: Release IPA
        uses: softprops/action-gh-release@v1
        with:
          files: output/LeicaLuxCamera.ipa
          tag_name: v1.0.0
          body: "هذا هو ملف التطبيق IPA جاهز للتثبيت المباشر عبر ESign."
          token: ${{ secrets.GITHUB_TOKEN }}
